<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kota Baru</title>
    <meta name="theme-color" content="#1b1f26" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <main id="stage">
        <div id="canvas-host"></div>
        <aside id="sidepanel"></aside>
        <div id="legend" hidden></div>
        <div id="tooltip" hidden></div>
        <div id="toasts" aria-live="polite"></div>
        <div id="palette" hidden></div>
        <div id="hudleft"><div id="goals" hidden></div><div id="coach" hidden></div></div>
        <div id="statusbar"></div>
        <div id="attribution"></div>
        <div id="loading" hidden></div>
      </main>
      <footer id="toolbar"></footer>
      <button id="install-btn" hidden>⬇ Install app</button>
      <div id="welcome" class="overlay" hidden></div>
      <div id="endscreen" class="overlay" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
